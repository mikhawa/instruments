server {
    listen 80;
    server_name localhost;
    root /var/www/app/public;

    client_max_body_size 25M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/app/public;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        internal;
    }

    # Aucun autre script PHP ne doit être exécutable
    location ~ \.php$ {
        return 404;
    }

    # Assets (AssetMapper) : cache navigateur long
    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        try_files $uri /index.php$is_args$args;
        expires 30d;
        access_log off;
    }

    error_log /var/log/nginx/instruments_error.log;
    access_log /var/log/nginx/instruments_access.log;
}
