# Environnement de développement local — Instruments traditionnels
# Démarrage : make up (ou docker compose up -d --build)
name: instruments

services:
  # PHP-FPM 8.3 + Composer (Symfony 7.4 LTS)
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    volumes:
      - ./:/var/www/app
      - composer_cache:/home/app/.composer/cache
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: mysql://${MARIADB_USER:-app}:${MARIADB_PASSWORD:-app}@database:3306/${MARIADB_DATABASE:-instruments}?serverVersion=11.4.0-MariaDB&charset=utf8mb4
      MAILER_DSN: smtp://mailer:1025
      # Xdebug désactivé par défaut : XDEBUG_MODE=debug make up pour l'activer
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      PHP_IDE_CONFIG: serverName=instruments
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      database:
        condition: service_healthy

  # Serveur web
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      # Projet entier (et non ./public) : évite que Docker crée public/ en root avant l'installation de Symfony
      - ./:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # Base de données
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-instruments}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-app}
    ports:
      # Exposé sur 3307 pour éviter un conflit avec un MariaDB/MySQL local
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/instruments.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Interface d'administration BDD
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 64M
    depends_on:
      database:
        condition: service_healthy

  # Capture des e-mails (confirmations de commande, etc.)
  mailer:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db_data:
  composer_cache:
